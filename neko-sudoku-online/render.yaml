services:
  - type: web
    name: neko-sudoku
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_PATH
        value: /var/data/neko-sudoku.db
      - key: APP_TIMEZONE_OFFSET_HOURS
        value: "8"
      - key: TRUST_PROXY
        value: "1"
    disk:
      name: neko-sudoku-data
      mountPath: /var/data
      sizeGB: 1
